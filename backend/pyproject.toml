[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consulta-medica"
version = "1.0.0"
description = "Backend de Consulta Médica Virtual (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "jsonschema==4.23.0",
    "langgraph==1.2.14",
    "langsmith==0.14.7",
    "numpy==2.5.3",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
pipeline = [
    "jsonschema==4.23.0",
]
indexing = [
    "lightrag-hku==1.5.7",
]
semantic = [
    "sentence-transformers>=3.3,<4",
]
# Voz neuronal del simulador (TTS_PROVIDER=edge; en Vercel va en el pyproject.toml de la raiz): npm run setup -- --extras voz
voz = [
    "edge-tts==7.3.1",
]
dev = [
    "pytest==8.3.4",
    "pygments==2.19.0",
    "pillow==11.3.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["case_preparation*", "server*"]

[tool.pytest.ini_options]
pythonpath = ["."]
