[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consulta-medica"
version = "1.1.0"
description = "Paciente Virtual Adaptativo: frontend, SMA, RAG seguro y pipeline de casos"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.4,<1.0",
    "jsonschema>=4.23,<5.0",
    "numpy>=1.26,<3",
]

[tool.vercel]
entrypoint = "server.main:app"

[project.optional-dependencies]
pipeline = [
    "jsonschema==4.23.0",
    "numpy>=1.26,<3",
]
indexing = [
    "lightrag-hku==1.5.7",
]
semantic = [
    "sentence-transformers>=3.3,<4",
]
dev = [
    "pytest>=8.3,<9.0",
    "pygments>=2.19,<3",
    "pillow>=11,<12",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["case_preparation*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
